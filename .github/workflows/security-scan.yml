# Semgrep runs fully inside its pinned container on the hosted runner's native
# Docker daemon. Rulesets come from the public registry without an account;
# `--config auto` is deliberately NOT used because it reports the project URL.
name: Security scan

on:
  pull_request:
    branches:
      - main
      - 'lts-*'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'lts-*'
  merge_group:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Renovate merges land dependency changes on main and need Semgrep and Trivy.
  semgrep:
    name: Semgrep analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Stop on a draft pull request
        uses: plurano/golusoris/.github/actions/stop-on-draft@e601567f4e1acb72525f361f80dac6d89cbad553 # #1212
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Verify the Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info

      - name: Run Semgrep
        shell: bash
        run: bash scripts/ci/semgrep-registry.sh

      - name: Run Trivy dependency, secret, and IaC gate
        shell: bash
        run: bash scripts/ci/trivy-scan.sh
